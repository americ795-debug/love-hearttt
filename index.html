
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #120016;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  canvas {
    width: min(90vw, 500px);
    height: min(90vw, 500px);
  }
  h1 {
    color: #ff4d88;
    text-shadow: 0 0 15px #ff0055;
    text-align: center;
  }
  p { color: #ffd6e5; }
</style>
</head>
<body>

<canvas id="heart" width="500" height="500"></canvas>
<h1>❤️ I LOVE YOU ❤️</h1>
<p>You make my world beautiful.</p>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");
let progress = 0;

function draw() {
  ctx.clearRect(0, 0, 500, 500);

  // Draw the heart shape
  ctx.beginPath();
  for (let i = 0; i <= progress; i++) {
    const t = i / 500 * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t)
              - 2 * Math.cos(3*t) - Math.cos(4*t);
    const px = 250 + x * 12;
    const py = 245 - y * 12;

    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }

  ctx.strokeStyle = "#ff176b";
  ctx.lineWidth = 3;
  ctx.shadowColor = "#ff0055";
  ctx.shadowBlur = 18;
  ctx.stroke();
  ctx.shadowBlur = 0;

  if (progress < 500) {
    progress += 3;
    requestAnimationFrame(draw);
  } else {
    // Make the completed heart glow
    ctx.fillStyle = "rgba(255, 23, 107, 0.12)";
    ctx.fill();
  }
}

draw();
</script>

</body>
</html>
