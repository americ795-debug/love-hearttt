
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For My Love ❤️</title>
<style>
body {
  margin: 0;
  background: black;
  color: pink;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  overflow: hidden;
}
canvas {
  width: min(95vw, 600px);
  height: min(95vw, 600px);
}
h1 {
  color: #ff4d9d;
  text-shadow: 0 0 15px hotpink;
  text-align: center;
}
</style>
</head>
<body>
<canvas id="c" width="600" height="600"></canvas>
<h1>❤️ I LOVE YOU ❤️</h1>
<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
const colors = ["red","blue","lime","yellow",
                "cyan","magenta","orange","pink"];
let i = 0;

function heart(t) {
  return {
    x: 300 + 16 * Math.sin(t)**3 * 12,
    y: 290 - (13*Math.cos(t)
      - 5*Math.cos(2*t)
      - 2*Math.cos(3*t)
      - Math.cos(4*t)) * 12
  };
}

function draw() {
  if (i >= 120) return;

  const p = heart(i * Math.PI * 2 / 120);
  ctx.strokeStyle = colors[Math.floor(Math.random()*colors.length)];
  ctx.lineWidth = 2;
  ctx.shadowColor = ctx.strokeStyle;
  ctx.shadowBlur = 10;

  ctx.beginPath();
  ctx.moveTo(300, 290);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();

  // Colorful star at each point
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(Math.random()*Math.PI);
  ctx.beginPath();
  for (let j=0; j<8; j++) {
    ctx.moveTo(0,0);
    ctx.lineTo(7,0);
    ctx.rotate(Math.PI/4);
  }
  ctx.stroke();
  ctx.restore();

  ctx.shadowBlur = 0;
  i++;
  setTimeout(draw, 25);
}
draw();
</script>
</body>
</html>
